name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.79.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.79.0

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Release build
        run: cargo build --release -p ark_cli --locked

  guards:
    name: Repository guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.79.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.79.0

      - name: Active tree guard
        shell: pwsh
        run: ./tests/active_tree_guard.ps1

      - name: FEN contract guard
        shell: pwsh
        run: ./tests/fen_contract_guard.ps1

      - name: Performance contract guard
        shell: pwsh
        run: ./tests/perf_contract_guard.ps1

      - name: Dependency guard
        shell: pwsh
        run: ./tests/dependency_guard.ps1
