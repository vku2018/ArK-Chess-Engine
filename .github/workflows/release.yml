name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: ark-x86_64-unknown-linux-gnu
            binary: ark
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: ark-x86_64-apple-darwin
            binary: ark
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: ark-aarch64-apple-darwin
            binary: ark
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: ark-x86_64-pc-windows-msvc
            binary: ark.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.79.0 --profile minimal --target "${{ matrix.target }}"
          rustup default 1.79.0

      - name: Build release binary
        run: cargo build --release --locked -p ark_cli --target "${{ matrix.target }}"

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "dist/${{ matrix.archive }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.archive }}/"
          cp README.md LICENSE "dist/${{ matrix.archive }}/"
          tar -C dist -czf "dist/${{ matrix.archive }}.tar.gz" "${{ matrix.archive }}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.archive }}" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.archive }}/"
          Copy-Item README.md, LICENSE "dist/${{ matrix.archive }}/"
          Compress-Archive -Path "dist/${{ matrix.archive }}/*" -DestinationPath "dist/${{ matrix.archive }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          mapfile -t assets < <(find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no release assets found" >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --title "$TAG_NAME" \
              --notes "Prebuilt ArK UCI binaries for Windows, Linux, and macOS."
          fi
