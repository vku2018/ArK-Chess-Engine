name: Bug report
description: Report incorrect engine behavior, crashes, or broken tooling.
title: "bug: "
labels: ["type: bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Provide the command, FEN, config, or test case that reproduces the issue.
      placeholder: ".\\scripts\\cargo-local.ps1 test"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation attempted
      description: List commands or checks already run.
